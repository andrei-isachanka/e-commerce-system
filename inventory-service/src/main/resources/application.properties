spring.application.name=inventory-service
server.port=8081

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/inventorydb
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Test data
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Kafka
spring.kafka.bootstrap-servers=localhost:9093

# Kafka producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Kafka consumer
spring.kafka.consumer.group-id=inventory-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=inventory_service.dto.OrderCreatedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=inventory_service.dto

spring.kafka.admin.fail-fast=true

spring.config.import=optional:file:./.env[.properties]